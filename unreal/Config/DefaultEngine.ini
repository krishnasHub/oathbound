[/Script/EngineSettings.GameMapsSettings]
; The level is generated at runtime from the map in game-data.json (ARPGWorldBuilder),
; so the game boots the engine's own empty level instead of shipping a .umap.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/ActionRPG.RPGGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.RendererSettings]
; Fully dynamic lighting: Lumen GI + reflections, virtual shadow maps, no baked lighting.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4
r.VolumetricFog=1
r.SkyAtmosphere=1
r.Nanite.ProjectEnabled=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[CoreRedirects]
; The combo/charged-attack montages were authored in the Third Person template and reference its
; AnimNotify classes (/Script/TP_ThirdPerson.AnimNotify_*). Our module defines classes with the
; same names and properties, so redirecting the package makes the template montages call our code.
+PackageRedirects=(OldName="/Script/TP_ThirdPerson",NewName="/Script/ActionRPG")

